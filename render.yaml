# Render Blueprint — Apollo Installer (API)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: conecte este repositório no Render Dashboard → "New Blueprint Instance".
# O Render detectará este arquivo na raiz.
#
# IMPORTANTE (estado real do deploy):
#   - O schema PostgreSQL é aplicado via SQL na Management API do Supabase
#     (arquivos database/schema.sql e database/seed.sql). NÃO usar `prisma db push`
#     no startCommand: o pooler transacional (6543) não suporta as consultas do
#     `db push` e o host direct (5432) não é alcançável a partir do Render.
#   - O `startCommand` é apenas `pnpm start`.
#   - `SECRETS_MASTER_KEY` precisa ser a MESMA chave usada ao criptografar os
#     segredos migrados do SQLite. Por isso é `sync: false` (não gerar valor novo).

services:
  - type: web
    name: apollo-installer-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: |
      npm i -g pnpm@9.15.9 &&
      pnpm install --no-frozen-lockfile --prod=false &&
      pnpm exec prisma generate --schema prisma/schema.production.prisma &&
      pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Supabase: Transaction Pooler (porta 6543) com sslmode=require.
      # Usar a MESMA string em DATABASE_URL e DIRECT_URL.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@apollofit.com.br
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Mesma chave do .env local — necessária para ler os segredos migrados.
      - key: SECRETS_MASTER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://apollo-installer.netlify.app,https://apollo-installer.apollofit.com.br
      - key: PUBLIC_API_URL
        value: https://apollo-installer-api.onrender.com
      - key: APP_URL
        value: https://apollo-installer.netlify.app
      - key: LOG_LEVEL
        value: info
      # Tokens globais também podem ser injetados pela UI em Credenciais.
      # A chave render.apiToken (conta antiga GK) deve ser preservada.
      - key: RENDER_REGION
        value: oregon
      - key: RENDER_PLAN
        value: free
